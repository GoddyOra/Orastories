# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Content (books/articles) is published straight to Supabase, not via a
  # git push - this nightly rebuild picks up newly published content into
  # the static SEO pages (see scripts/generate-seo-pages.mjs) without
  # waiting on the next code change.
  schedule:
    - cron: "17 6 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # generate-seo-pages.mjs (part of `npm run build` below) creates a
          # real @supabase/supabase-js client, which eagerly initializes its
          # Realtime client on construction even though this script never
          # subscribes to anything - that init throws on Node < 22, which
          # lacks a native WebSocket global. Node 20 built cleanly right up
          # until this script was added because nothing before it ever
          # touched supabase-js during the build itself. Pinned to 24
          # specifically (not just the ">=22" minimum) to match local dev -
          # this exact mismatch is what let the bug reach CI unnoticed.
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload built static files
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
