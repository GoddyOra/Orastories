  <script>
    const themeToggle = document.getElementById('themeToggle');
    const reviewsBody = document.getElementById('reviewsBody');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const siteLogo = document.getElementById('siteLogo');

    // A flat <img> logo can't inherit dark-mode CSS from this page, so the
    // near-black strokes/text baked into the light-mode file just vanish
    // against a dark nav - swapping to a pre-built dark variant is the fix.
    const setLogoTheme = (isDark) => {
      siteLogo.src = isDark ? 'images/logos/orastories-logo-option-2-dark.svg' : 'images/logos/orastories-logo-option-2.svg';
    };

    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    setLogoTheme(isDarkMode);
    if (isDarkMode) {
      reviewsBody.classList.add('dark-mode');
      reviewsBody.style.backgroundColor = '#0f0f0f';
      reviewsBody.style.color = '#e0e0e0';
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = reviewsBody.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', isDark);
      setLogoTheme(isDark);

      if (isDark) {
        reviewsBody.style.backgroundColor = '#0f0f0f';
        reviewsBody.style.color = '#e0e0e0';
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        reviewsBody.style.backgroundColor = '#fcfaf7';
        reviewsBody.style.color = '#1a1a1a';
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    });
  </script>
  <script type="module">
    const SUPABASE_URL = 'https://spordcubtugawsyelqxz.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwb3JkY3VidHVnYXdzeWVscXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTQ0MTMsImV4cCI6MjEwMTY5MDQxM30.jQhzR_pTDIFpaJDfBmxn0-9gFovxNRZEt4nfy20uNbg';

    const reviewsList = document.getElementById('reviewsList');

    (async () => {
      let supabase;
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (error) {
        console.error('Orastories reviews: failed to load Supabase client', error);
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-red-500">Unable to load reviews right now. Please try again.</p>';
        return;
      }

      // Star-only ratings (no written comment) still count toward each
      // book's average rating elsewhere on the site (BookCard, JSON-LD
      // AggregateRating) - they just don't get their own card here, since a
      // page of bare star rows with no comment reads as thin content. Star-
      // only reviews store body as '' rather than null, so both are excluded.
      const { data, error } = await supabase
        .from('reviews')
        .select('id,rating,body,books(title),profiles(username,display_name,role)')
        .not('body', 'is', null)
        .neq('body', '')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        console.error('Failed to load reviews:', error);
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-red-500">Unable to load reviews right now. Please try again.</p>';
        return;
      }

      const reviews = (data || [])
        .map((row) => {
          const book = Array.isArray(row.books) ? row.books[0] : row.books;
          const profile = Array.isArray(row.profiles) ? row.profiles[0] : row.profiles;
          if (!book) return null;
          return {
            rating: row.rating,
            body: row.body,
            bookTitle: book.title,
            reviewerName: (profile && (profile.username || profile.display_name)) || 'A Reader',
            reviewerUsername: profile && profile.role === 'creator' ? profile.username : null
          };
        })
        .filter(Boolean);

      if (reviews.length === 0) {
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-gray-500 dark:text-gray-400">No reviews yet — be the first to leave one after reading a book.</p>';
        return;
      }

      reviewsList.innerHTML = '';
      reviews.forEach((review) => {
        // Book title, reviewer name, and body are all user-submitted (creator
        // metadata / reader-chosen usernames / free-text review bodies) and
        // rendered on a public page for every visitor - built via DOM APIs
        // with textContent rather than innerHTML so none of it can execute
        // as markup.
        const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);

        const card = document.createElement('div');
        card.className =
          'border-l-4 border-amber-700 dark:border-amber-400 bg-white dark:bg-gray-900 p-6 rounded transition-all duration-300';

        const header = document.createElement('div');
        header.className = 'flex justify-between items-start mb-4';

        const titleBlock = document.createElement('div');
        const title = document.createElement('h3');
        title.className = 'text-xl font-bold dark:text-white';
        title.textContent = review.bookTitle;
        let name;
        if (review.reviewerUsername) {
          name = document.createElement('a');
          name.href = '/?creator=' + encodeURIComponent(review.reviewerUsername);
          name.className = 'text-sm text-gray-600 dark:text-gray-400 hover:text-amber-700 dark:hover:text-amber-400 transition-colors';
        } else {
          name = document.createElement('p');
          name.className = 'text-sm text-gray-600 dark:text-gray-400';
        }
        name.textContent = review.reviewerName;
        titleBlock.appendChild(title);
        titleBlock.appendChild(name);

        const starEl = document.createElement('div');
        starEl.className = 'text-amber-700 dark:text-amber-400';
        starEl.textContent = stars;

        header.appendChild(titleBlock);
        header.appendChild(starEl);
        card.appendChild(header);

        if (review.body) {
          const body = document.createElement('p');
          body.className = 'text-gray-700 dark:text-gray-300 leading-relaxed';
          body.textContent = review.body;
          card.appendChild(body);
        }

        reviewsList.appendChild(card);
      });
    })();
  </script>
