<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orastories | Reviews</title>
  <meta name="description" content="Read what Orastories readers are saying about Goddy Ora's contemporary romance novels — real reviews from the reading community.">
  <link rel="icon" type="image/svg+xml" href="images/logos/orastories-logo-option-2.svg">
  <link rel="stylesheet" href="styles/tailwind.generated.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet"></noscript>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #fcfaf7;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1d1d1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b1b1b1;
    }
    
    body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .dark-mode ::-webkit-scrollbar-track {
      background: #0f0f0f;
    }
  </style>
</head>
<body id="reviewsBody" class="bg-[#fcfaf7] text-[#1a1a1a] font-['Montserrat'] transition-colors duration-500">
  <nav class="fixed top-0 left-0 right-0 bg-white/95 dark:bg-black/95 backdrop-blur z-50 border-b border-gray-200 dark:border-white/10 transition-colors duration-500">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 md:px-6 py-3 md:py-4 flex flex-wrap justify-between items-center gap-3">
      <a href="/" class="inline-flex items-center transition-opacity hover:opacity-90" aria-label="Orastories Home">
        <img src="images/logos/orastories-logo-option-2.svg" alt="Orastories" class="h-10 w-auto" />
      </a>
      <div class="flex flex-wrap justify-end gap-3 sm:gap-5 md:gap-8 items-center text-sm sm:text-base">
        <a href="/" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">Home</a>
        <a href="/about" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">About</a>
        <a href="/books" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">Books</a>
        <a href="/reviews" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">Reviews</a>
        <a href="/blog" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">Blog</a>
        <a href="/contact" class="hover:text-amber-700 dark:hover:text-amber-400 transition-colors">Contact</a>
        <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle Theme">
          <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </nav>

  <main class="pt-20 max-w-4xl mx-auto px-3 sm:px-4 md:px-6 py-16">
    <h1 class="text-3xl font-['Playfair Display'] font-bold mb-12 text-center dark:text-white">Reader Reviews</h1>
    
    <div id="reviewsList" class="space-y-8">
      <p class="text-center text-sm uppercase tracking-[0.3em] text-gray-400 dark:text-gray-600">Loading reviews...</p>
    </div>
  </main>

  <footer class="border-t border-gray-200 dark:border-white/10 mt-16 py-8 text-center text-gray-600 dark:text-gray-400 transition-colors duration-500">
    <p>&copy; 2026 Orastories. All rights reserved.</p>
  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const reviewsBody = document.getElementById('reviewsBody');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    if (isDarkMode) {
      reviewsBody.classList.add('dark-mode');
      reviewsBody.style.backgroundColor = '#0f0f0f';
      reviewsBody.style.color = '#e0e0e0';
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = reviewsBody.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', isDark);

      if (isDark) {
        reviewsBody.style.backgroundColor = '#0f0f0f';
        reviewsBody.style.color = '#e0e0e0';
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        reviewsBody.style.backgroundColor = '#fcfaf7';
        reviewsBody.style.color = '#1a1a1a';
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    });
  </script>
  <script type="module">
    const SUPABASE_URL = 'https://spordcubtugawsyelqxz.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwb3JkY3VidHVnYXdzeWVscXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTQ0MTMsImV4cCI6MjEwMTY5MDQxM30.jQhzR_pTDIFpaJDfBmxn0-9gFovxNRZEt4nfy20uNbg';

    const reviewsList = document.getElementById('reviewsList');

    (async () => {
      let supabase;
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (error) {
        console.error('Orastories reviews: failed to load Supabase client', error);
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-red-500">Unable to load reviews right now. Please try again.</p>';
        return;
      }

      const { data, error } = await supabase
        .from('reviews')
        .select('id,rating,body,books(title),profiles(username,display_name,role)')
        .order('created_at', { ascending: false })
        .limit(20);

      if (error) {
        console.error('Failed to load reviews:', error);
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-red-500">Unable to load reviews right now. Please try again.</p>';
        return;
      }

      const reviews = (data || [])
        .map((row) => {
          const book = Array.isArray(row.books) ? row.books[0] : row.books;
          const profile = Array.isArray(row.profiles) ? row.profiles[0] : row.profiles;
          if (!book) return null;
          return {
            rating: row.rating,
            body: row.body,
            bookTitle: book.title,
            reviewerName: (profile && (profile.username || profile.display_name)) || 'A Reader',
            reviewerUsername: profile && profile.role === 'creator' ? profile.username : null
          };
        })
        .filter(Boolean);

      if (reviews.length === 0) {
        reviewsList.innerHTML =
          '<p class="text-center text-sm text-gray-500 dark:text-gray-400">No reviews yet — be the first to leave one after reading a book.</p>';
        return;
      }

      reviewsList.innerHTML = '';
      reviews.forEach((review) => {
        // Book title, reviewer name, and body are all user-submitted (creator
        // metadata / reader-chosen usernames / free-text review bodies) and
        // rendered on a public page for every visitor - built via DOM APIs
        // with textContent rather than innerHTML so none of it can execute
        // as markup.
        const stars = '★'.repeat(review.rating) + '☆'.repeat(5 - review.rating);

        const card = document.createElement('div');
        card.className =
          'border-l-4 border-amber-700 dark:border-amber-400 bg-white dark:bg-gray-900 p-6 rounded transition-all duration-300';

        const header = document.createElement('div');
        header.className = 'flex justify-between items-start mb-4';

        const titleBlock = document.createElement('div');
        const title = document.createElement('h3');
        title.className = 'text-xl font-bold dark:text-white';
        title.textContent = review.bookTitle;
        let name;
        if (review.reviewerUsername) {
          name = document.createElement('a');
          name.href = '/?creator=' + encodeURIComponent(review.reviewerUsername);
          name.className = 'text-sm text-gray-600 dark:text-gray-400 hover:text-amber-700 dark:hover:text-amber-400 transition-colors';
        } else {
          name = document.createElement('p');
          name.className = 'text-sm text-gray-600 dark:text-gray-400';
        }
        name.textContent = review.reviewerName;
        titleBlock.appendChild(title);
        titleBlock.appendChild(name);

        const starEl = document.createElement('div');
        starEl.className = 'text-amber-700 dark:text-amber-400';
        starEl.textContent = stars;

        header.appendChild(titleBlock);
        header.appendChild(starEl);
        card.appendChild(header);

        if (review.body) {
          const body = document.createElement('p');
          body.className = 'text-gray-700 dark:text-gray-300 leading-relaxed';
          body.textContent = review.body;
          card.appendChild(body);
        }

        reviewsList.appendChild(card);
      });
    })();
  </script>
  <script type="module" src="scripts/navigation.js"></script>
</body>
</html>
