  </footer>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const blogBody = document.getElementById('blogBody');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const siteLogo = document.getElementById('siteLogo');

    // A flat <img> logo can't inherit dark-mode CSS from this page, so the
    // near-black strokes/text baked into the light-mode file just vanish
    // against a dark nav - swapping to a pre-built dark variant is the fix.
    const setLogoTheme = (isDark) => {
      siteLogo.src = isDark ? 'images/logos/orastories-logo-option-2-dark.svg' : 'images/logos/orastories-logo-option-2.svg';
    };

    const isDarkMode = localStorage.getItem('darkMode') === 'true';
    setLogoTheme(isDarkMode);
    if (isDarkMode) {
      blogBody.classList.add('dark-mode');
      blogBody.style.backgroundColor = '#0f0f0f';
      blogBody.style.color = '#e0e0e0';
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    }

    themeToggle.addEventListener('click', () => {
      const isDark = blogBody.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', isDark);
      setLogoTheme(isDark);

      if (isDark) {
        blogBody.style.backgroundColor = '#0f0f0f';
        blogBody.style.color = '#e0e0e0';
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        blogBody.style.backgroundColor = '#fcfaf7';
        blogBody.style.color = '#1a1a1a';
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    });
  </script>
  <script type="module">
    const SUPABASE_URL = 'https://spordcubtugawsyelqxz.supabase.co';
    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwb3JkY3VidHVnYXdzeWVscXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTQ0MTMsImV4cCI6MjEwMTY5MDQxM30.jQhzR_pTDIFpaJDfBmxn0-9gFovxNRZEt4nfy20uNbg';

    const sortControls = document.getElementById('sortControls');
    const articlesList = document.getElementById('articlesList');

    const SORTS = [
      { key: 'relevance', label: 'Relevance' },
      { key: 'popular', label: 'Popular' },
      { key: 'newest', label: 'Newest' }
    ];

    (async () => {
      let supabase;
      try {
        const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (error) {
        console.error('Orastories blog: failed to load Supabase client', error);
        articlesList.innerHTML =
          '<p class="col-span-full text-center text-sm text-red-500">Unable to load articles right now. Please try again.</p>';
        return;
      }

      const { data, error } = await supabase
        .from('articles')
        .select('id,slug,title,cover_image_url,cover_image_alt,keywords,view_count,created_at,profiles(username,display_name,role),article_ratings(rating)')
        .eq('is_published', true);

      if (error) {
        console.error('Failed to load articles:', error);
        articlesList.innerHTML =
          '<p class="col-span-full text-center text-sm text-red-500">Unable to load articles right now. Please try again.</p>';
        return;
      }

      const articles = (data || []).map((row) => {
        const profile = Array.isArray(row.profiles) ? row.profiles[0] : row.profiles;
        const ratings = (row.article_ratings || []).map((r) => r.rating);
        const ratingCount = ratings.length;
        const averageRating = ratingCount > 0 ? ratings.reduce((a, b) => a + b, 0) / ratingCount : null;
        return {
          slug: row.slug,
          title: row.title,
          coverImageUrl: row.cover_image_url,
          coverImageAlt: row.cover_image_alt,
          viewCount: row.view_count,
          createdAt: row.created_at,
          authorUsername: profile ? profile.username : null,
          authorName: profile ? profile.display_name || profile.username : 'A Reader',
          authorIsCreator: profile ? profile.role === 'creator' : false,
          averageRating,
          ratingCount
        };
      });

      let currentSort = 'relevance';

      function renderSortControls() {
        sortControls.innerHTML = '';
        SORTS.forEach((s) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          const active = currentSort === s.key;
          btn.className =
            'px-4 py-2 text-[10px] font-bold uppercase tracking-[0.2em] border rounded-full transition-all ' +
            (active
              ? 'bg-amber-700 border-amber-700 text-white dark:bg-amber-600 dark:border-amber-600'
              : 'border-black/15 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10');
          btn.textContent = s.label;
          btn.addEventListener('click', () => {
            currentSort = s.key;
            renderSortControls();
            renderArticles();
          });
          sortControls.appendChild(btn);
        });
      }

      function renderArticles() {
        let list = articles;
        const sortKey = currentSort;

        list = list.slice().sort((a, b) => {
          if (sortKey === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
          if (sortKey === 'popular') return b.viewCount - a.viewCount;
          const score = (x) => x.viewCount + (x.averageRating || 0) * 20;
          return score(b) - score(a);
        });

        articlesList.innerHTML = '';

        if (list.length === 0) {
          articlesList.innerHTML = '<p class="col-span-full text-center text-sm text-gray-500 dark:text-gray-400">No articles here yet.</p>';
          return;
        }

        list.forEach((article) => {
          const card = document.createElement('article');
          card.className =
            'rounded-sm border overflow-hidden transition-all duration-300 hover:shadow-lg bg-white dark:bg-[#161616] border-black/10 dark:border-white/10';

          const link = document.createElement('a');
          link.href = '/?article=' + encodeURIComponent(article.slug);
          link.className = 'block';

          if (article.coverImageUrl) {
            const imgWrap = document.createElement('div');
            imgWrap.className = 'aspect-[16/9] overflow-hidden';
            const img = document.createElement('img');
            img.src = article.coverImageUrl;
            img.alt = article.coverImageAlt || article.title;
            img.loading = 'lazy';
            img.className = 'w-full h-full object-cover';
            imgWrap.appendChild(img);
            link.appendChild(imgWrap);
          }

          const body = document.createElement('div');
          body.className = 'p-5';
          const title = document.createElement('h2');
          title.className = "text-xl font-['Playfair_Display'] font-bold mb-2 dark:text-white";
          title.textContent = article.title;
          body.appendChild(title);
          if (article.averageRating) {
            const meta = document.createElement('p');
            meta.className = 'text-xs uppercase tracking-[0.15em] text-gray-500 dark:text-gray-400';
            meta.textContent = article.averageRating.toFixed(1) + ' ★ (' + article.ratingCount + ')';
            body.appendChild(meta);
          }
          link.appendChild(body);
          card.appendChild(link);

          const byline = document.createElement('p');
          byline.className = 'px-5 pb-5 text-xs text-gray-500 dark:text-gray-400';
          byline.textContent = 'By ' + article.authorName;
          card.appendChild(byline);

          articlesList.appendChild(card);
        });
      }

      renderSortControls();
      renderArticles();
    })();
  </script>
